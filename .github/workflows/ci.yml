name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Verify Node runtime
        run: node -e "if (process.version !== 'v22.23.4') throw new Error(process.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
